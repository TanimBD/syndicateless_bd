name: synlessbd
description: "সিন্ডিকেটমুক্ত বাংলাদেশ — citizen platform to report and fight syndicates across sectors of Bangladesh."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app.png
